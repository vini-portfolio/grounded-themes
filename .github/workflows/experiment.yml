name: Experiment
on:
  push:
    branches: ['experiment/**']

permissions:
  contents: read

jobs:
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run experiment:embeddings
