name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * *' # nightly full browser run on Ubuntu and macOS

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Committed-file guard (tree, and history of this pull request)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-weights.mjs --since "origin/${{ github.base_ref }}"
          else
            npm run check:weights
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests with networking disabled
        run: sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" npm run test:unit

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore model files
        id: models
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-${{ hashFiles('src/worker/runtime-config.js') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Report model cache use
        if: always()
        run: echo "model cache hit=${{ steps.models.outputs.cache-hit }}; files=$(ls .model-cache 2>/dev/null | wc -l)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
